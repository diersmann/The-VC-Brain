name: ${COMPOSE_PROJECT_NAME:-vc-brain}

services:
  frontend:
    build:
      context: ./frontend
      target: production
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./backend
      target: production
    command: /opt/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vc_brain}:${POSTGRES_PASSWORD:-vc_brain_dev}@postgres:5432/${POSTGRES_DB:-vc_brain}
      APP_REDIS_URL: redis://redis:6379/0
      APP_MINIO_ENDPOINT: minio:9000
      APP_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      APP_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      APP_MINIO_BUCKET: vc-brain-snapshots
      APP_LLM_API_KEY: ${LLM_API_KEY:-}
      APP_LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      APP_CORS_ORIGINS: https://${APP_PUBLIC_HOST:-hn.diersmann.eu}
      APP_GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      APP_PRODUCTHUNT_TOKEN: ${PRODUCTHUNT_TOKEN:-}
      APP_TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      APP_YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      target: production
    command: /opt/venv/bin/arq app.worker.WorkerSettings
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vc_brain}:${POSTGRES_PASSWORD:-vc_brain_dev}@postgres:5432/${POSTGRES_DB:-vc_brain}
      APP_REDIS_URL: redis://redis:6379/0
      APP_MINIO_ENDPOINT: minio:9000
      APP_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      APP_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      APP_MINIO_BUCKET: vc-brain-snapshots
      APP_LLM_API_KEY: ${LLM_API_KEY:-}
      APP_LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      APP_GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      APP_PRODUCTHUNT_TOKEN: ${PRODUCTHUNT_TOKEN:-}
      APP_TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      APP_YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vc_brain}
      POSTGRES_USER: ${POSTGRES_USER:-vc_brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vc_brain_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
