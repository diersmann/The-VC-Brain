[project]
name = "vc-brain-backend"
version = "0.1.0"
description = "API for The VC Brain"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aioboto3>=12.0,<13",
  "alembic>=1.16.4,<2",
  "arq>=0.26.0,<1",
  "asyncpg>=0.30.0,<1",
  "fastapi>=0.116.1,<1",
  "feedparser>=6.0,<7",
  "httpx>=0.28.1,<1",
  "openai>=1.0.0,<2",
  "pydantic-settings>=2.10.1,<3",
  "pyyaml>=6.0,<7",
  "redis>=5.0,<6",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "structlog>=25.4.0,<26",
  "tavily-python>=0.5.0,<1",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "fakeredis[lua]>=2.26.0,<3",
  "mypy>=1.17.0,<2",
  "pytest>=8.4.1,<9",
  "pytest-asyncio>=1.1.0,<2",
  "respx>=0.22.0,<1",
  "ruff>=0.12.5,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
