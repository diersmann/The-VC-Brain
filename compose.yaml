name: ${COMPOSE_PROJECT_NAME:-vc-brain}

services:
  frontend:
    build:
      context: ./frontend
      target: development
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ./backend
      target: development
    command: /opt/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vc_brain}:${POSTGRES_PASSWORD:-vc_brain_dev}@postgres:5432/${POSTGRES_DB:-vc_brain}
      APP_REDIS_URL: redis://redis:6379/0
      APP_MINIO_ENDPOINT: minio:9000
      APP_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      APP_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      APP_MINIO_BUCKET: vc-brain-snapshots
      APP_LLM_API_KEY: ${LLM_API_KEY:-}
      APP_LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      APP_CORS_ORIGINS: http://localhost:5173
      APP_GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      APP_PRODUCTHUNT_TOKEN: ${PRODUCTHUNT_TOKEN:-}
      APP_TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      APP_YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      APP_SIGNAL_THRESHOLD: ${SIGNAL_THRESHOLD:-0.45}
      APP_CONTACT_THRESHOLD: ${CONTACT_THRESHOLD:-0.65}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ./backend
      target: development
    command: /opt/venv/bin/arq app.worker.WorkerSettings
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vc_brain}:${POSTGRES_PASSWORD:-vc_brain_dev}@postgres:5432/${POSTGRES_DB:-vc_brain}
      APP_REDIS_URL: redis://redis:6379/0
      APP_MINIO_ENDPOINT: minio:9000
      APP_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      APP_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      APP_MINIO_BUCKET: vc-brain-snapshots
      APP_LLM_API_KEY: ${LLM_API_KEY:-}
      APP_LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      APP_GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      APP_PRODUCTHUNT_TOKEN: ${PRODUCTHUNT_TOKEN:-}
      APP_TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      APP_YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      APP_SIGNAL_THRESHOLD: ${SIGNAL_THRESHOLD:-0.45}
      APP_CONTACT_THRESHOLD: ${CONTACT_THRESHOLD:-0.65}
      APP_AGENT_MONTHLY_BUDGET: ${AGENT_MONTHLY_BUDGET:-100}
      APP_MOCK_REPLY_DELAY_SECONDS: ${MOCK_REPLY_DELAY_SECONDS:-120}
      APP_PIPELINE_STUCK_AFTER_MINUTES: ${PIPELINE_STUCK_AFTER_MINUTES:-30}
      APP_PIPELINE_BATCH_SIZE: ${PIPELINE_BATCH_SIZE:-5}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vc_brain}
      POSTGRES_USER: ${POSTGRES_USER:-vc_brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vc_brain_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  frontend_node_modules:
  postgres_data:
  redis_data:
  minio_data:
