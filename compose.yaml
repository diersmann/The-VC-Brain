name: ${COMPOSE_PROJECT_NAME:-vc-brain}

services:
  frontend:
    build:
      context: ./frontend
      target: development
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ./backend
      target: development
    command: /opt/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vc_brain}:${POSTGRES_PASSWORD:-vc_brain_dev}@postgres:5432/${POSTGRES_DB:-vc_brain}
      APP_LLM_API_KEY: ${LLM_API_KEY:-}
      APP_LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      APP_CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vc_brain}
      POSTGRES_USER: ${POSTGRES_USER:-vc_brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vc_brain_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  frontend_node_modules:
  postgres_data:
